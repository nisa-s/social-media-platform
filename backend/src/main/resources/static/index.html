<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Y - Why? Tell Me!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-gray-50 min-h-screen font-sans">

  <!-- LOGIN / REGISTER SCREEN -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">

      <!-- LOGIN FORM -->
      <div id="login-form-area">
        <div class="text-center mb-8">
          <h1 class="text-4xl font-extrabold text-blue-600 tracking-tighter">Y</h1>
          <p class="text-gray-500 mt-2 font-medium">TELL ME WHY!</p>
        </div>

        <div class="space-y-4">
          <input id="email" type="text" placeholder="Kullanıcı Adı veya E-posta"
                 class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition" />
          <input id="password" type="password" placeholder="Şifre"
                 class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition" />
          <button onclick="login()"
                  class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg active:scale-95 transition">
            Giriş Yap
          </button>
        </div>

        <p class="text-center mt-6 text-sm text-gray-600">
          Hesabın yok mu?
          <button onclick="showRegister()" class="text-blue-600 font-bold hover:underline">Kayıt Ol</button>
        </p>
      </div>

      <!-- REGISTER FORM -->
      <div id="register-form-area" class="hidden">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-800">Hesap Oluştur</h1>
        </div>

        <div class="space-y-4">
          <input id="reg-username" type="text" placeholder="Kullanıcı Adı"
                 class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-400 transition" />
          <input id="reg-email" type="email" placeholder="E-posta"
                 class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-400 transition" />
          <input id="reg-password" type="password" placeholder="Şifre"
                 class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-green-400 transition" />
          <button onclick="register()"
                  class="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 shadow-lg active:scale-95 transition">
            Kayıt Ol
          </button>
        </div>

        <p class="text-center mt-6 text-sm text-gray-600">
          Zaten hesabın var mı?
          <button onclick="showLogin()" class="text-blue-600 font-bold hover:underline">Giriş Yap</button>
        </p>
      </div>

    </div>
  </div>

  <!-- MAIN FEED -->
  <div id="main-feed" class="hidden flex flex-col md:flex-row max-w-6xl mx-auto py-6 px-4 gap-6">

    <!-- LEFT SIDEBAR -->
    <aside class="md:w-1/4 space-y-4">

      <!-- PROFILE CARD (eskisi gibi kutu) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">

        <!-- Avatar + Upload -->
        <div class="relative group mx-auto mb-4 w-20 h-20">
          <div id="avatar-initial"
               class="w-full h-full bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-3xl font-bold overflow-hidden">
            <img id="profile-img" class="hidden w-full h-full object-cover" src="" alt="profile" />
            <span id="initial-text">Z</span>
          </div>
        </div>

        <h2 id="stat-username" class="font-bold text-xl text-gray-800">-</h2>

        <div class="grid grid-cols-2 gap-4 border-t pt-4 mt-4">
          <div>
            <span id="stat-followers" class="block font-bold text-lg">0</span>
            <span class="text-xs text-gray-400">TAKİPÇİ</span>
          </div>
          <div>
            <span id="stat-following" class="block font-bold text-lg">0</span>
            <span class="text-xs text-gray-400">TAKİP</span>
          </div>
        </div>

      </div>

      <button onclick="logout()"
              class="w-full text-left p-4 text-red-500 font-bold hover:bg-red-50 rounded-xl transition">
        Oturumu Kapat
      </button>
    </aside>

    <!-- CENTER COLUMN -->
    <main class="md:w-2/4 space-y-6">

      <!-- CREATE POST -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <textarea id="post-content" rows="3"
                  class="w-full p-3 bg-gray-50 border-none rounded-xl focus:ring-0 resize-none"
                  placeholder="Neler oluyor? (Örn: Bugün proje bitti #java #spring)"></textarea>
        <button onclick="createPost()"
                class="mt-3 w-full bg-blue-600 text-white py-2 rounded-full font-bold shadow-md hover:bg-blue-700 transition">
          Paylaş
        </button>
      </div>

      <!-- PROFILE BAR (profile mode only) -->
      <div id="profile-bar"
           class="hidden bg-blue-50 p-3 rounded-xl border border-blue-100 flex justify-between items-center">
        <span id="profile-title" class="font-bold text-blue-800">Profil</span>
        <button onclick="switchTab('feed')" class="text-sm font-bold text-blue-600 hover:underline">← Akışa dön</button>
      </div>

      <!-- HASHTAG HEADER (hashtag filter mode only) -->
      <div id="hashtag-header"
           class="hidden bg-blue-50 p-3 rounded-xl border border-blue-100 flex justify-between items-center">
        <span id="hashtag-title" class="font-bold text-blue-800">#etiket</span>
        <button onclick="switchTab('explore')" class="text-sm font-bold text-blue-600 hover:underline">← Keşfet'e dön</button>
      </div>

      <!-- TABS -->
      <div class="flex border-b border-gray-200">
        <button id="tab-feed" onclick="switchTab('feed')"
                class="px-6 py-3 font-bold text-blue-600 border-b-4 border-blue-600 transition-all duration-300">
          Akış
        </button>

        <button id="tab-explore" onclick="switchTab('explore')"
                class="px-6 py-3 font-bold text-gray-400 border-b-4 border-transparent hover:text-blue-600 transition-all duration-300">
          Keşfet
        </button>

        <button id="tab-likes" onclick="switchTab('likes')"
                class="px-6 py-3 font-bold text-gray-400 border-b-4 border-transparent hover:text-blue-600 transition-all duration-300">
          Beğenilerim
        </button>
      </div>

      <div id="posts-container" class="space-y-4"></div>
    </main>

    <!-- RIGHT SIDEBAR: HASHTAGS -->
    <aside class="md:w-1/4 hidden lg:block">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 sticky top-6">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-gray-800">Trend Hashtagler</h3>
          <button onclick="switchTab('explore')" class="text-xs font-bold text-gray-500 hover:underline">Sıfırla</button>
        </div>

        <div id="hashtag-list" class="flex flex-wrap gap-2"></div>

        <p class="text-xs text-gray-400 mt-2">
          Bir etikete tıklayınca ilgili postlar listelenir (Keşfet içinden filtreler).
        </p>
      </div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
